<!DOCTYPE html>

<html class="h-full bg-surface" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SalesLens - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .curve-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,50 Q25,20 50,50 T100,50' fill='none' stroke='%233B73F6' stroke-width='2' stroke-opacity='0.05' /%3E%3C/svg%3E");
            background-size: 200% 200%;
            animation: moveCurve 30s linear infinite;
        }
        @keyframes moveCurve {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
    </style>
</head>
<body class="h-full bg-surface text-on-surface flex items-center justify-center relative overflow-hidden font-body-md" style="background-color: #f7f9fb;">
<!-- Subtle Background Element -->
<div class="absolute inset-0 curve-bg z-0 pointer-events-none opacity-50"></div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-md p-8 bg-surface-container-lowest rounded-2xl shadow-[0_4px_6px_-1px_rgb(0,0,0,0.05)] border border-surface-variant flex flex-col gap-6">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-4 border-b border-surface-variant pb-6">
<div class="flex items-center gap-2">
<img alt="SalesLens Logo" class="h-10 w-auto object-contain rounded" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEp_mJH-W7tdrirmmZmj9QapQt6ldD9wzogN2ZZMYAPDzmctsYSyCIM7OmNfJXUxKiCnoBb7qqK0_yGErzIDBrVcHSLXPm1eHGVnEuvcQptAMEGnnigF7lDonPzSFTWi8hyCzi9lLcH9zqzOx-Lwdpy9fhq6Qqnl3YVTx94cNIKFPF72M4jKJXo2rVBWp1XCRPPNtpLp6oRhxcyq733mWYHWG0LgfkN2nPdE_Qv8-p_Aed-Vk_Rh-05dCPP2IrwMXuupc"/>
<span class="font-headline-md text-headline-md text-primary tracking-tight">SalesLens</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Sign in to continue to SalesLens</p>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<div class="relative">
<input class="w-full rounded-lg border border-outline-variant bg-surface px-4 py-2.5 text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-all outline-none" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full rounded-lg border border-outline-variant bg-surface px-4 py-2.5 pr-10 text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-1 bg-surface transition-colors cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none text-sm" for="remember">Remember me</label>
</div>
<!-- Sign In Button -->
<button class="w-full bg-[#3B73F6] hover:bg-[#2563EB] text-white font-body-md text-body-md font-semibold py-3 px-6 rounded-lg shadow-sm transition-all duration-200 active:scale-[0.98] active:shadow-none flex justify-center items-center gap-2 mt-2" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Sign In -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low border border-outline-variant text-on-surface font-body-md text-body-md font-medium py-2.5 px-6 rounded-lg transition-colors flex justify-center items-center gap-3" type="button">
<svg class="h-5 w-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.79 15.73 17.57V20.34H19.29C21.38 18.42 22.56 15.59 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.01 19.29 20.34L15.73 17.57C14.74 18.23 13.48 18.64 12 18.64C9.13 18.64 6.7 16.7 5.84 14.09H2.17V16.94C3.98 20.53 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.84 14.09C5.62 13.43 5.49 12.73 5.49 12C5.49 11.27 5.62 10.57 5.84 9.91V7.06H2.17C1.43 8.55 1 10.22 1 12C1 13.78 1.43 15.45 2.17 16.94L5.84 14.09Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.06 5.92 16.2 7.01L19.37 3.84C17.45 2.05 14.97 1 12 1C7.69 1 3.98 3.47 2.17 7.06L5.84 9.91C6.7 7.3 9.13 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Footer -->
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-2 text-sm">
            Don't have an account? <a class="text-primary hover:text-on-primary-fixed-variant font-medium transition-colors" href="#">Create Account</a>
</p>
</div>
</body></html>
